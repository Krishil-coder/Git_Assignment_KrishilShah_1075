<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <form method="post" action="./Submit.html" >
             <legend>Form</legend>
            <fieldset>
             <div>  
                <label for="Name">Name</label>
                <input type="text" name="Name" id="Name"
                placeholder="FirstName_LastName" required>
                </div> 
                <br>
                <div>
                <label for="About">About</label>
                <textarea name="about" rows="5" cols="50"></textarea required>
                </div>
                <br>
                <div>
                    <label for="Email">Email</label>
                    <input type="email" name="email" id="email"
                    placeholder="aa@gmail.com" required>
                </div>
                <br>
                <div>
                    <label for="password">Paswword</label>
                    <input type="password" min="8" max="15" required
                    id="password" name="password" >
                </div>
                <br>
                <div>
                <label for="Phone no">Phone No</label>
                <input type="tel" minlength="10" pattern="[0-9]{10}" required
                name="phone" id="phone" placeholder="digis only">
                </div>
                <br>
                <div>
                    <label for="website">Website</label>
                    <input type="url" name="Website" id="Website"
                     placeholder="https://www.google.com">
                </div>
            <br>
            <div>
                <label for="Skills">Skills</label>
                <input type="checkbox" name="Skills" value="Html" checked>Html
                <input type="checkbox" name="Skills" value="CSS">Css
                <input type="checkbox" name="Skills" value="JavaScript">JavaScript
            </div> 
            <br>
            <div>
                <label for="Gender">Gender</label>
                <input type="radio" name="Gender" value="Male">Male
                 <input type="radio" name="Gender" value="Female">Female
            </div>
            <br>
            <div>
                <label for="Color">Color</label>
                <input type="color" >
            </div>
            <br>
            <div>
                <label for="Experience">Number</label>
                <input type="number" min="0" max="10">
            </div>
            <br>
            <div>
                <label for="Date">Date</label>
                <input type="date" id="Date" name="Date"
                max="2010-12-31">
            </div>
            <br>
            <div>
                <label for="Available Time">Available Time</label>
                <input type="time" min="09:00" max="18:00">
            </div>
            <br>
            <div>
            <label for="joinmonth">Joining Month</label>
            <input type="month" name="joinmonth" id="joinmonth"
                   value="2026-01">
        </div>
        <br>
        <div>
            <label for="Training week">Training week</label>
            <input type="Training week" name="Training week" id="Training week"
             value="2026-07">
        </div>
            
            </fieldset>
        </form>
</body>
</html>
