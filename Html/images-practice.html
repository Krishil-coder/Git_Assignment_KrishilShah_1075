<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Images Practice</title>
</head>
<body>

    <h1>HTML Images Demonstration</h1>

    <h2>Local Images</h2>

    <!-- PNG Image -->
    <img src="images/nature scenery.jpeg" 
         alt="Sample jpef image showing a landscape" 
         width="300">

    <br><br>

    <!-- JPEG Image -->
    <img src="images/city view.jpeg" 
         alt="Sample JPEG image of a city view" 
         width="300">

    <br><br>

    <!-- AVIF Image with Title Attribute -->
    <img src="images/nature scenery.jpeg" 
         alt="Sample AVIF image of nature scenery" 
         width="300"
         title="Beautiful Nature Image">

    <h2>External Image</h2>

    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
         alt="External image of mountains from Unsplash"
         width="300">

</body>
</html>
