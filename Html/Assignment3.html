<!DOCTYPE html>
<html>
<head>
    <title>Assignment</title>
</head>
<body>

<form method="get" action="./Submit.html">
    <fieldset> 
        <legend>Information</legend>

        <div>
            <label for="name">Full Name</label>
            <input type="text" name="name" id="name"
                   placeholder="FirstName_LastName" required>
        </div>

        <div>
            <label for="about">About Yourself</label>
            <textarea name="about" id="about" cols="50" rows="5"></textarea>
        </div>

        <div>
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email"
                   placeholder="abc@gmail.com" required>
        </div>

        <div>
            <label for="password">Password</label>
            <input type="password" name="password" id="password"
                   placeholder="At least 8 characters"
                   minlength="8" required>
        </div>

        <div>
            <label for="phone">Phone Number</label>
            <input type="tel" name="phone" id="phone"
                   pattern="[0-9]{10}" maxlength="10"
                   placeholder="9876543210">
        </div>

        <div>
            <label for="website">Website</label>
            <input type="url" name="website" id="website"
                   placeholder="https://www.google.com">
        </div>

        <br>

        <div>
            <label>Skills</label><br>
            <input type="checkbox" name="skills" value="HTML" checked> HTML
            <input type="checkbox" name="skills" value="CSS"> CSS
            <input type="checkbox" name="skills" value="JavaScript"> JavaScript
        </div>

        <div>
            <label>Gender</label>
            <input type="radio" name="gender" value="Male" checked> Male
            <input type="radio" name="gender" value="Female"> Female
        </div>

        <div>
            <label for="color">Preferred Color</label>
            <input type="color" name="color" id="color" value="#741002">
        </div>

        <div>
            <label for="exp">Experience</label>
            <input type="number" name="exp" id="exp"
                   step="1" min="0" max="10">
        </div>

        <div>
            <label for="search">Search Interest</label>
            <input type="search" name="search" id="search">
        </div>

        <br>

        <div>
            <label for="dob">Date of Birth</label>
            <input type="date" name="dob" id="dob"
                   max="2005-12-31">
        </div>

        <div>
            <label for="availtime">Available Time</label>
            <input type="time" name="availtime" id="availtime"
                   min="09:00" max="18:30">
        </div>

        <div>
            <label for="joinmonth">Joining Month</label>
            <input type="month" name="joinmonth" id="joinmonth"
                   value="2026-01">
        </div>

        <div>
            <label for="trainingweek">Training Week</label>
            <input type="week" name="trainingweek"
                   id="trainingweek" value="2026-W07">
        </div>

        <div>
            <label for="interview">Interview Slot</label>
            <input type="time" name="interview" id="interview">
        </div>

        <br>

        <div>
            <label for="technology">Technology</label>
            <select name="technology" id="technology">
                <option value="" disabled selected>Select</option>
                <option value=".NET">.NET</option>
                <option value="Angular">Angular</option>
                <option value="Java">Java</option>
                <option value="ReactJS">ReactJS</option>
                <option value="QA">QA</option>
            </select>
        </div>

        <div>
            <label for="resume">Resume Upload</label>
            <input type="file" name="resume" id="resume">
        </div>

        <input type="hidden" name="hidden" value="12345678">

        <br>

        <div>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
            <input type="button" value="Click">
        </div>

    </fieldset>
</form>

</body>
</html>
